[project]
name = "leasing-scoring"
version = "1.0.0"
description = "Интеграция лизинговой заявки с банковским скорингом: требования, UML, WSDL и OpenAPI, которые проверяются кодом"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "zeep>=4.3",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.scripts]
leasing = "leasing.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "jsonschema>=4.23",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-pyyaml>=6.0",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leasing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["req(*ids): требования из docs/srs.md, которые проверяет тест"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["leasing"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["zeep", "zeep.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zeep без аннотаций типов: вызовы из клиента скоринга остаются нетипизированными.
module = ["leasing.client"]
disallow_untyped_calls = false
